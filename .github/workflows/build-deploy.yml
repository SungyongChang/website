name: Build CV and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile CV (pdflatex, two passes)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv
          compiler: pdflatex

      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp index.html CNAME _site/
          cp assets/photo.jpg _site/assets/
          cp cv/cv.pdf _site/assets/cv.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
